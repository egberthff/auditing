<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#667eea">
  <meta name="description" content="Track shared travel expenses offline; everyone pays an equal share. Syncs when you're back online.">
  <title>Travel Audit</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon-192.png">
</head>
<body>
  <div class="container">
    <header class="app-header">
      <h1><a href="#/">💰 Travel Audit</a></h1>
      <div class="header-right">
        <button type="button" id="syncPill" class="pill" title="Sync status">…</button>
        <div id="account" class="account"></div>
      </div>
    </header>
    <div id="updateBanner" class="banner info" hidden></div>
    <div id="appBanner" class="banner" role="alert" hidden></div>
    <section id="signIn" hidden></section>
    <main id="app" aria-live="polite">
      <p class="no-data">Loading…</p>
    </main>
  </div>
  <div id="toast" class="toast" role="status" hidden></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
